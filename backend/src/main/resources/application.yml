spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymdb}
    username: ${DB_USERNAME:gym}
    password: ${DB_PASSWORD:gym}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:0123456789012345678901234567890123456789}
    access-expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  ai:
    api-key: ${OPENAI_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
