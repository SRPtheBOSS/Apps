version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gymdb
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gymdb
      DB_USERNAME: gym
      DB_PASSWORD: gym
      JWT_SECRET: 0123456789012345678901234567890123456789
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
